name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Checks & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Prepare Test Environment File
        working-directory: backend
        run: cp .env.test.example .env.test

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Validate Prisma Schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opspilot_test
        run: npx prisma validate

      - name: Deploy Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opspilot_test
        run: npx prisma migrate deploy

      - name: TypeScript Check
        working-directory: backend
        run: npm run typecheck

      - name: ESLint Check
        working-directory: backend
        run: npm run lint

      - name: Run Test Suite
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opspilot_test
          JWT_SECRET: opspilot-ci-jwt-secret-at-least-32-chars-long
          ADMIN_API_KEY: opspilot-ci-admin-api-key-test-value
          AI_PROVIDER: mock
        run: npm test

  frontend:
    name: Frontend Checks & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web/web
        run: npm ci

      - name: TypeScript Check
        working-directory: web/web
        run: npm run typecheck

      - name: Production Build
        working-directory: web/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
        run: npm run build
